{{- if .Values.llmInference.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veripay.fullname" . }}-llm
spec:
  replicas: {{ .Values.llmInference.replicaCount }}
  selector:
    matchLabels: { app: {{ include "veripay.fullname" . }}-llm }
  template:
    metadata:
      labels: { app: {{ include "veripay.fullname" . }}-llm }
    spec:
      nodeSelector:
{{ toYaml .Values.llmInference.nodeSelector | indent 8 }}
      containers:
        - name: inference
          image: {{ .Values.llmInference.image | quote }}
          args: {{ toYaml .Values.llmInference.args | nindent 12 }}
          ports:
            - containerPort: {{ .Values.llmInference.port }}
          resources:
{{ toYaml .Values.llmInference.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "veripay.fullname" . }}-llm
spec:
  selector: { app: {{ include "veripay.fullname" . }}-llm }
  ports:
    - port: {{ .Values.llmInference.port }}
      targetPort: {{ .Values.llmInference.port }}
{{- end }}
