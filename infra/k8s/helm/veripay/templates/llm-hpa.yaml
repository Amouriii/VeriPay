{{- if and .Values.llmInference.enabled .Values.llmInference.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "veripay.fullname" . }}-llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "veripay.fullname" . }}-llm
  minReplicas: {{ .Values.llmInference.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.llmInference.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.llmInference.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
