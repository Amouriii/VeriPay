# VeriPay local dev stack with WireMock (Contributions.md §4.2, Dev 5).
# Usage: docker compose -f infra/compose/docker-compose.dev.yml up -d
include:
  - kafka.yml
  - redis.yml
  - postgres.yml

services:
  wiremock:
    image: wiremock/wiremock:3.9
    ports: ["8080:8080"]
    volumes: ["../wiremock/mappings:/home/wiremock/mappings"]
    command: ["--global-response-templating", "--verbose"]
