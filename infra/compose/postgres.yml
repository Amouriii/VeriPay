services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: veripay
      POSTGRES_PASSWORD: veripay
      POSTGRES_DB: customer_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U veripay -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: