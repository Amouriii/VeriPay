    depends_on:
      postgres:
        condition: service_healthy
  feature_store:
    build:
      context: ../..
      dockerfile: services/feature_store/Dockerfile
    ports: ["8004:8000"]
    env_file: [.env]
    healthcheck: *backend-healthcheck
    depends_on:
      redis:
        condition: service_healthy
  rule_engine:
    build:
      context: ../..
      dockerfile: services/rule_engine/Dockerfile
