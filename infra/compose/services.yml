# All VeriPay backend services. Toggle by commenting out as needed during dev.
# Each service image is built from its Dockerfile using the REPOSITORY ROOT as
# the build context, because each Dockerfile installs the local veripay-common
# dependency from source (../../ from this directory is the repo root).
#
# Every backend runs uvicorn on 8000 with a /health route; the shared
# healthcheck below probes it with Python's stdlib (no curl required in the
# slim base image) so `depends_on.*.condition: service_healthy` gates startup.
include:
  - kafka.yml
  - redis.yml
  - postgres.yml

x-backend-healthcheck: &backend-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  ingress:
    build:
      context: ../..
      dockerfile: services/ingress/Dockerfile
    ports: ["8001:8000"]
    env_file: [.env]
    healthcheck: *backend-healthcheck
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  token_vault:
    build:
      context: ../..
      dockerfile: services/token_vault/Dockerfile
    ports: ["8002:8000"]
    env_file: [.env]
    healthcheck: *backend-healthcheck
  audit_store:
