<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b131f" />
    <title>VeriPay Analyst Dashboard</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong mode.
      try {
        var stored = localStorage.getItem('veripay-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
