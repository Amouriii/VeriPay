name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- proto -----
  buf:
    name: Buf lint & breaking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        if: github.ref != 'refs/heads/main'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

  # ---------------------------------------------------------------- lint -----
  lint:
    name: Lint (ruff + mypy + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e libs/veripay_common
      - name: Install web deps
        run: npm ci || npm install
        working-directory: web
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy libs services
      - name: eslint
        run: npm run lint
        working-directory: web
      - name: tsc --noEmit
        run: npx tsc --noEmit
        working-directory: web

  # ----------------------------------------------------------- ingress -----
  ingress:
    name: Ingress contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ingress dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/veripay_common
          pip install -e services/ingress
          pip install pytest httpx
      - name: Run ingress tests
        run: pytest -q services/ingress/tests

  # -------------------------------------------------------- token-vault -----
  token-vault:
    name: Token vault contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install token vault dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/veripay_common
          pip install -e services/token_vault
          pip install pytest httpx
      - name: Run token vault tests
        run: pytest -q services/token_vault/tests

  # --------------------------------------------------------- audit-store -----
  audit-store:
    name: Audit store contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit store dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/veripay_common
          pip install -e services/audit_store
          pip install pytest httpx
      - name: Run audit store tests
        run: pytest -q services/audit_store/tests

  # --------------------------------------------------------- rule-engine -----
  rule-engine:
    name: Rule engine contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install rule engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/veripay_common
          pip install -e services/rule_engine
          pip install pytest httpx
      - name: Run rule engine tests
        run: pytest -q services/rule_engine/tests

  # --------------------------------------------------------- risk-fusion -----
  risk-fusion:
    name: Risk fusion contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install risk fusion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/veripay_common
          pip install -e services/risk_fusion
          pip install pytest httpx
      - name: Run risk fusion tests
        run: pytest -q services/risk_fusion/tests

  # ------------------------------------------------------- developer5-services -----
  developer5-services:
    name: Developer 5 service tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - decision_engine
          - device_integrity
          - merchant_policy
          - compliance_engine
          - financial_context
          - external_context
          - feedback_loop
          - dispute_engine
          - fi_ops_portal
          - business_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/veripay_common
          pip install -e services/${{ matrix.service }}
          pip install pytest httpx
      - name: Run service tests
        run: pytest -q services/${{ matrix.service }}/tests

  # ------------------------------------------------------------ mobile-ios -----
  mobile-ios:
    name: iOS SDK tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift package tests
        run: swift test
        working-directory: mobile/ios

  # --------------------------------------------------------- mobile-android -----
  mobile-android:
    name: Android SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Run Android unit tests
        run: gradle test
        working-directory: mobile/android

  # --------------------------------------------------------- compose-config -----
  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local Compose environment
        run: touch infra/compose/.env
      - name: Validate dependency stack
        run: docker compose -f infra/compose/docker-compose.dev.yml config --quiet
      - name: Validate backend service stack
        run: docker compose -f infra/compose/services.yml config --quiet
      - name: Validate combined stack
        run: docker compose -f infra/compose/docker-compose.dev.yml -f infra/compose/services.yml config --quiet

  # ---------------------------------------------------------------- test -----
  test-python:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -e libs/veripay_common
          pip install -e ml --no-deps
          for s in services/*; do
            [ -f "$s/pyproject.toml" ] && pip install -e "$s" || true
          done
      - name: pytest
        run: pytest -q

  test-web:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci || npm install
        working-directory: web
      - name: vitest
        run: npm test -- --run
        working-directory: web
