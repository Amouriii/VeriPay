[project]
name = "veripay-streaming"
version = "0.1.0"
description = "Apache Flink (PyFlink) streaming jobs for real-time feature aggregation (PLAN §9)."
requires-python = ">=3.11"
dependencies = ["apache-flink>=1.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
