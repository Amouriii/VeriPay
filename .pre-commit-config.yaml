repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.3.0
    hooks:
      - id: conventional-pre-commit
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript check (web)
        entry: bash -c 'cd web && ./node_modules/.bin/tsc --noEmit'
        language: system
        files: ^web/
        types: [text]
      - id: eslint
        name: ESLint (web)
        entry: bash -c 'cd web && ./node_modules/.bin/eslint .'
        language: system
        files: ^web/.*\.(ts|tsx)$
        types: [text]
        pass_filenames: false
      - id: vitest
        name: Vitest (web)
        entry: bash -c 'cd web && ./node_modules/.bin/vitest run'
        language: system
        files: ^web/(src|tests)/.*\.(test|spec)\.(ts|tsx)$
        types: [text]
        pass_filenames: false
