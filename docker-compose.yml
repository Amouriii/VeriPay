# VeriPay local dev stack. Each service is wired here for local development.
# Per-service Dockerfiles live in services/<name>/Dockerfile.
include:
  - infra/compose/kafka.yml
  - infra/compose/redis.yml
  - infra/compose/postgres.yml
  - infra/compose/services.yml

services:
  # Add dev-only helpers here (e.g., seed, migrate). Service runtimes are in
  # infra/compose/services.yml so they can be toggled together.
  migrate:
    image: postgres:16-alpine
    depends_on: [postgres]
    volumes: ["./datasets/migrations:/migrations:ro"]
    environment:
      PGUSER: veripay
      PGPASSWORD: veripay
      PGHOST: postgres
      PGPORT: "5432"
    entrypoint:
      - sh
      - -c
      - >-
        until pg_isready -d veripay_customer_db; do sleep 1; done;
        for database in veripay_bank_db veripay_fraud_ops_db veripay_merchant_db veripay_mobile_db; do
          createdb -T template0 "$$database" 2>/dev/null || true;
        done;
        psql -d veripay_customer_db -f /migrations/customer/001_customer.sql;
        psql -d veripay_bank_db -f /migrations/bank/001_bank.sql;
        psql -d veripay_fraud_ops_db -f /migrations/fraud_ops/001_fraud_operations.sql;
        psql -d veripay_merchant_db -f /migrations/merchant/001_merchant.sql;
        psql -d veripay_mobile_db -f /migrations/mobile/001_mobile.sql
