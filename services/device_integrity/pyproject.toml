[project]
name = "veripay-device_integrity"
version = "0.1.0"
description = "Device Integrity & GPV (§14,§15) - Attestation verification, challenge nonces, GPV signal intake."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-device_integrity = "veripay_device_integrity.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_device_integrity*"]
