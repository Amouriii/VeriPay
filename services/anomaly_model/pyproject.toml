[project]
name = "veripay-anomaly_model"
version = "0.1.0"
description = "Behavioral Anomaly Model (§11) - Isolation Forest serving, normalized 0-100 anomaly score."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-anomaly_model = "veripay_anomaly_model.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_anomaly_model*"]
