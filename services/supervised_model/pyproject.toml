[project]
name = "veripay-supervised_model"
version = "0.1.0"
description = "Supervised Fraud Model (§10,§20) - XGBoost/LightGBM serving + TreeSHAP explainability."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "veripay-common",
]

[project.optional-dependencies]
model = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "joblib>=1.3",
]

[project.scripts]
veripay-supervised_model = "veripay_supervised_model.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_supervised_model*"]
