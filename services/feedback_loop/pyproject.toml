[project]
name = "veripay-feedback_loop"
version = "0.1.0"
description = "Human Feedback Loop (§21) - Analyst review labels -> Iceberg, drift/retrain triggers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-feedback_loop = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
