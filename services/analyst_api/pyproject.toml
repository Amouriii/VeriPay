[project]
name = "veripay-analyst_api"
version = "0.1.0"
description = "Analyst API composite - /score, /explain, /customer profile, /feedback, /feedback/stats, /retrain, /health."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-analyst-api = "veripay_analyst_api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_analyst_api*"]