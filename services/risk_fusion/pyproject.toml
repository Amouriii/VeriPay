[project]
name = "veripay-risk_fusion"
version = "0.1.0"
description = "Risk Fusion Engine (§18) - Weighted fusion -> unified 0-100 score, weight redistribution."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-risk_fusion = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
