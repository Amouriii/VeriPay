[project]
name = "veripay-compliance_engine"
version = "0.1.0"
description = "Compliance Engine (Expansion §1 Dev4, §2) - PCI-DSS 4.0, PSD3/SCA triggers, network zero-trust constraints."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-compliance_engine = "veripay_compliance_engine.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_compliance_engine*"]
