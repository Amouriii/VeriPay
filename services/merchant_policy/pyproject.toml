[project]
name = "veripay-merchant_policy"
version = "0.1.0"
description = "Merchant Policy Engine (Expansion §1 Dev4, §2) - Custom velocity rules, MCC restrictions, dynamic merchant-lock enforcement."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-merchant_policy = "veripay_merchant_policy.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_merchant_policy*"]
