[project]
name = "veripay-audit_store"
version = "0.1.0"
description = "Audit Store (§22) - PostgreSQL persistence: transactions, VCN registry, device registry, audit trail."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-audit_store = "veripay_audit_store.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_audit_store*"]
