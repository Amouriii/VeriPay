[project]
name = "veripay-model_monitor"
version = "0.1.0"
description = "Model Monitor (§10,§21) - drift detection and gated automated retraining wired to the model registry."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "veripay-common",
]

[project.scripts]
veripay-model_monitor = "veripay_model_monitor.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_model_monitor*"]
