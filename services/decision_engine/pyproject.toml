[project]
name = "veripay-decision_engine"
version = "0.1.0"
description = "Cost-Aware Decision Engine (§19) - Expected-value router -> DecisionAction."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-decision_engine = "veripay_decision_engine.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_decision_engine*"]
