[project]
name = "veripay-business_portal"
version = "0.1.0"
description = "Business Portal (Expansion §1 Dev5, §2) - B2B treasury portal, merchant fraud manager, ERP sync connectors."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-business_portal = "veripay_business_portal.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_business_portal*"]
