[project]
name = "veripay-rule_engine"
version = "0.1.0"
description = "Rule Engine (§13) - Deterministic hard rules: dCVV mismatch, merchant-lock, burner velocity, impossible travel, signal contradiction."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-rule_engine = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
