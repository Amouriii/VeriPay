[project]
name = "veripay-token_vault"
version = "0.1.0"
description = "Token Vault & dCVV Engine (§6.1,§22) - VCN->PAN conversion, dCVV validation, merchant-lock enforcement."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-token_vault = "veripay_token_vault.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_token_vault*"]
