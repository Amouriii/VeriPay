[project]
name = "veripay-auth_orchestration"
version = "0.1.0"
description = "Authentication Orchestration (§16) - 3DS/biometric/WebAuthn step-up, PASS/FAIL/EXPIRE."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-auth_orchestration = "veripay_auth_orchestration.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_auth_orchestration*"]
