[project]
name = "veripay-merchant_ingress"
version = "0.1.0"
description = "Merchant Ingress (Expansion §1 Dev1, §2) - Merchant Ingress APIs, VCN issuance endpoints, webhook push engine."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-merchant_ingress = "veripay_merchant_ingress.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_merchant_ingress*"]
