[project]
name = "veripay-ingress"
version = "0.1.0"
description = "Ingress Service (§5,§6.1) - ISO 8583 + REST/gRPC ingestion and dual-phase entry point."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "veripay-common",
]

[project.scripts]
veripay-ingress = "veripay_ingress.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veripay_ingress*"]
