// Risk scores: component + fused (PLAN §7, §10, §11, §12, §18).
syntax = "proto3";

package veripay.risk.v1;

enum RiskBand {
  RISK_BAND_UNSPECIFIED = 0;
  RISK_BAND_APPROVE = 1;      // legacy projection: 0-25
  RISK_BAND_VERIFY = 2;       // legacy projection: 26-50
  RISK_BAND_BLOCK = 3;        // legacy projection: 51-100
}

enum RiskTier {
  RISK_TIER_UNSPECIFIED = 0;
  RISK_TIER_NO_RISK = 1;      // 0-5%
  RISK_TIER_LOW = 2;          // >5-25%
  RISK_TIER_MODERATE = 3;     // >25-50%
  RISK_TIER_HIGH = 4;         // >50-100%
}

message ComponentScore {
  string component = 1;    // "supervised" | "anomaly" | "graph" | "rules" | "device" | "gpv" | "financial" | "external"
  int32 score = 2;         // 0-100
  double weight = 3;       // contribution weight used in fusion
  bool available = 4;      // false => weight redistributed (PLAN §18)
  string reason_code = 5;  // e.g. DCVV_MISMATCH (PLAN §20)
}

message RiskScore {
  string transaction_id = 1;
  int32 unified_score = 2;        // 0-100 percentage score
  RiskBand band = 3;              // legacy compatibility projection
  repeated ComponentScore components = 4;
  RiskTier tier = 5;              // operational risk-gating tier
}

message FuseRequest {
  string transaction_id = 1;
  repeated ComponentScore components = 2;
}

message FuseResponse {
  RiskScore score = 1;
}

service RiskFusionService {
  rpc Fuse(FuseRequest) returns (FuseResponse);
}
