// Online feature store lookups (PLAN §8, §9).
syntax = "proto3";
package veripay.features.v1;

message FeatureVector {
  string transaction_id = 1;
  // 8.1 Transaction
  bool vcn_indicator = 2;
  string token_type = 3;            // TokenType name
  string dcvv_validation_status = 4;// DcvvStatus name
  // 8.2 Behavioral
  double amount_vs_avg = 5;
  double amount_zscore = 6;
  double spend_7d = 7;
  double spend_30d = 8;
  int64 seconds_since_prev_tx = 9;
  double location_deviation = 10;
  int32 unique_merchants_30d = 11;
  int32 unique_devices_30d = 12;
  // 8.3 Velocity
  int32 tx_count_5m = 13;
  int32 tx_count_1h = 14;
  int32 tx_count_24h = 15;
  double spend_1h = 16;
  double spend_24h = 17;
  int32 failed_auth_attempts = 18;
  int32 recent_decline_count = 19;
  int32 token_gen_1h = 20;
  int32 token_gen_24h = 21;
  int32 failed_dcvv_attempts = 22;
  int32 revoked_vcn_count_24h = 23;
  // 8.4 Device
  bool registered_device = 24;
  int32 device_age_days = 25;
  string platform_attestation = 26;
  bool jailbreak_root = 27;
  bool mock_location = 28;
  string device_trust_state = 29;
  // 8.5 Spatial
  string merchant_h3_r8 = 30;
  string merchant_h3_r10 = 31;
  string device_h3_r10 = 32;
  double grid_distance_m = 33;
  double gps_accuracy_radius_m = 34;
  string gpv_outcome = 35;
  bool impossible_travel = 36;
  // 8.6 Financial-behavior
  double expense_to_income_ratio = 37;
  double cash_flow_trend = 38;
  double disposable_income_estimate = 39;
  double balance_trend = 40;
  // 8.7 External-context
  double inflation_index = 41;
  double exchange_rate_delta = 42;
  string seasonal_event = 43;
}

message FeatureLookupRequest {
  string transaction_id = 1;
  string user_id = 2;
  string merchant_id = 3;
  int64 now_unix_ms = 4;
}

message FeatureLookupResponse {
  FeatureVector vector = 1;
  int64 staleness_ms = 2;
}

service FeatureStore {
  rpc Lookup(FeatureLookupRequest) returns (FeatureLookupResponse);
}
