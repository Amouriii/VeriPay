// Transaction ingress & lifecycle contracts (PLAN §5, §6.1).
syntax = "proto3";

package veripay.transaction.v1;

// ISO 8583 message type indicator values supported by the ingress layer.
enum Mti {
  MTI_UNSPECIFIED = 0;
  MTI_AUTHORIZATION_REQUEST = 1;       // 0100
  MTI_AUTHORIZATION_RESPONSE = 2;      // 0110
  MTI_AUTHORIZATION_REVERSAL = 3;      // 0400
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_CARD_PRESENT = 1;            // POS / merchant terminal
  CHANNEL_CARD_NOT_PRESENT = 2;        // e-commerce gateway
}

enum PaymentRail {
  PAYMENT_RAIL_UNSPECIFIED = 0;
  PAYMENT_RAIL_CARD = 1;
  PAYMENT_RAIL_ISO_8583 = 2;
  PAYMENT_RAIL_FEDNOW = 3;
  PAYMENT_RAIL_RTP = 4;
  PAYMENT_RAIL_ACH = 5;
  PAYMENT_RAIL_SWIFT = 6;
  PAYMENT_RAIL_ISO_20022 = 7;
  PAYMENT_RAIL_DOMESTIC_INSTANT = 8;
}

enum ProcessingPath {
  PROCESSING_PATH_UNSPECIFIED = 0;
  PROCESSING_PATH_FAST = 1;       // card authorization, <500ms target
  PROCESSING_PATH_SECONDARY = 2;  // wire/instant transfer, <5000ms target
}

message TransactionEvent {
  string transaction_id = 1;
  string user_id = 2;
  Mti mti = 3;
  Channel channel = 4;
  string merchant_id = 5;
  string mcc = 6;
  string currency = 7;
  int64 amount_minor = 8;          // minor units (cents)
  string payment_instrument = 9;   // PAN / VCN reference
  int64 timestamp_unix_ms = 10;
  optional string terminal_id = 11;
  optional string device_id = 12;
  optional double merchant_lat = 13;
  optional double merchant_lon = 14;
  optional double device_lat = 15;
  optional double device_lon = 16;
  optional string ip = 17;
  PaymentRail payment_rail = 18;
  ProcessingPath processing_path = 19;
}

message AuthorizationRequest {
  TransactionEvent event = 1;
  string request_cvv = 2;          // submitted CVV / dCVV
}

message AuthorizationResponse {
  string transaction_id = 1;
  string decision = 2;             // DecisionAction as string
  int32 risk_score = 3;            // 0-100 percentage score
  string reason_code = 4;
  optional string challenge_id = 5;
  string risk_tier = 6;
  string friction = 7;
  int32 verification_timeout_seconds = 8;
  string processing_path = 9;
  string explanation_mode = 10;
}
