// Cost-aware decision routing (PLAN §19).
syntax = "proto3";
package veripay.decision.v1;

enum DecisionAction {
  DECISION_UNSPECIFIED = 0;
  ALLOW = 1;
  MONITOR = 2;
  CHALLENGE = 3;
  REVIEW = 4;
  DECLINE = 5;
  REVERSE = 6;
}

message DecisionRequest {
  string transaction_id = 1;
  int32 risk_score = 2;
  int64 potential_loss_minor = 3; // expected fraud loss ≈ P(fraud) × loss
  double p_fraud = 4;
  double investigation_cost = 5;
  double auth_friction = 6;       // customer friction estimate
  double churn_risk = 7;          // customer churn risk estimate
}

message DecisionResponse {
  string transaction_id = 1;
  DecisionAction action = 2;
  string rationale = 3;
  optional string challenge_id = 4;
}

service DecisionEngine {
  rpc Decide(DecisionRequest) returns (DecisionResponse);
}
