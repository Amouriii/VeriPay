[project]
name = "veripay-workspace"
version = "0.1.0"
description = "VeriPay fraud-detection platform monorepo (dev tooling)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["libs", "services", "streaming", "ml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
ignore_missing_imports = true
disallow_untyped_defs = false  # stubs have untyped bodies
exclude = ["tests/", ".*/tests/"]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "streaming", "ml"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
